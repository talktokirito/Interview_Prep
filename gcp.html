<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCP — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>GCP Services</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Compute</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Compute Engine</button>
          <button type="button" class="priority-must">Cloud Run</button>
          <button type="button" class="priority-must">Cloud Functions</button>
          <button type="button" class="priority-low">App Engine</button>
          <button type="button" class="priority-medium">Batch</button>
          <button type="button" class="priority-low">Bare Metal Solution</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Containers and Kubernetes</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Google Kubernetes Engine (GKE)</button>
          <button type="button" class="priority-must">Artifact Registry</button>
          <button type="button" class="priority-medium">Cloud Deploy</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Storage</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Cloud Storage</button>
          <button type="button" class="priority-medium">Persistent Disk</button>
          <button type="button" class="priority-low">Filestore</button>
          <button type="button" class="priority-low">Storage Transfer Service</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Databases</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Cloud SQL</button>
          <button type="button" class="priority-medium">AlloyDB</button>
          <button type="button" class="priority-medium">Cloud Spanner</button>
          <button type="button" class="priority-medium">Firestore</button>
          <button type="button" class="priority-medium">Bigtable</button>
          <button type="button" class="priority-must">Memorystore</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Networking</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">VPC</button>
          <button type="button" class="priority-must">Cloud Load Balancing</button>
          <button type="button" class="priority-medium">Cloud CDN</button>
          <button type="button" class="priority-medium">Cloud DNS</button>
          <button type="button" class="priority-medium">Cloud NAT</button>
          <button type="button" class="priority-medium">Cloud Interconnect</button>
          <button type="button" class="priority-medium">Cloud Armor</button>
          <button type="button" class="priority-low">Network Connectivity Center</button>
        </nav>
      </article>

      <article class="guide">
        <h3>API Management</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">API Gateway</button>
          <button type="button" class="priority-low">Apigee</button>
          <button type="button" class="priority-low">Endpoints</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Data Analytics</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">BigQuery</button>
          <button type="button" class="priority-medium">Dataflow</button>
          <button type="button" class="priority-low">Dataproc</button>
          <button type="button" class="priority-must">Pub/Sub</button>
          <button type="button" class="priority-medium">Cloud Composer</button>
          <button type="button" class="priority-low">Data Fusion</button>
          <button type="button" class="priority-low">Dataplex</button>
          <button type="button" class="priority-low">Looker</button>
          <button type="button" class="priority-low">Datastream</button>
        </nav>
      </article>

      <article class="guide">
        <h3>AI and Machine Learning</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Vertex AI</button>
          <button type="button" class="priority-medium">Gemini API</button>
          <button type="button" class="priority-low">AutoML</button>
          <button type="button" class="priority-low">Vision AI</button>
          <button type="button" class="priority-low">Natural Language AI</button>
          <button type="button" class="priority-low">Speech-to-Text</button>
          <button type="button" class="priority-low">Text-to-Speech</button>
          <button type="button" class="priority-low">Translation AI</button>
          <button type="button" class="priority-low">Document AI</button>
          <button type="button" class="priority-low">Video Intelligence API</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Identity and Security</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">IAM</button>
          <button type="button" class="priority-must">Cloud KMS</button>
          <button type="button" class="priority-must">Secret Manager</button>
          <button type="button" class="priority-medium">Identity Platform</button>
          <button type="button" class="priority-medium">Security Command Center</button>
          <button type="button" class="priority-low">Binary Authorization</button>
          <button type="button" class="priority-medium">Resource Manager</button>
          <button type="button" class="priority-low">VPC Service Controls</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Management and Monitoring</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Cloud Monitoring</button>
          <button type="button" class="priority-must">Cloud Logging</button>
          <button type="button" class="priority-medium">Cloud Trace</button>
          <button type="button" class="priority-low">Cloud Profiler</button>
          <button type="button" class="priority-low">Cloud Asset Inventory</button>
          <button type="button" class="priority-low">Billing</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Developer Tools and Integration</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Cloud Build</button>
          <button type="button" class="priority-low">Cloud Shell</button>
          <button type="button" class="priority-medium">Cloud Scheduler</button>
          <button type="button" class="priority-medium">Cloud Tasks</button>
          <button type="button" class="priority-medium">Workflows</button>
          <button type="button" class="priority-medium">Eventarc</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="gcp-answers.js"></script>
  <script src="service-answers.js"></script>
</body>
</html>
