<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps for Java Developers — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>DevOps for Java Developers</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Containers</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Docker Essentials</button>
          <button type="button" class="priority-must">Dockerfile Best Practices</button>
          <button type="button" class="priority-must">Kubernetes Core Objects</button>
          <button type="button" class="priority-medium">Docker Compose</button>
          <button type="button" class="priority-medium">Helm</button>
        </nav>
      </article>

      <article class="guide">
        <h3>CI/CD and Source Control</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">CI/CD Pipelines</button>
          <button type="button" class="priority-must">Git Branching Strategies</button>
          <button type="button" class="priority-must">Git Merge vs Rebase</button>
          <button type="button" class="priority-must">Maven vs Gradle</button>
          <button type="button" class="priority-medium">Git Troubleshooting (reset, revert, reflog, bisect)</button>
          <button type="button" class="priority-medium">Artifact Repositories and Versioning</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Infrastructure and Operations</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Secrets Management</button>
          <button type="button" class="priority-must">Linux Commands for Java Developers</button>
          <button type="button" class="priority-must">Networking Basics (DNS, TCP, HTTP)</button>
          <button type="button" class="priority-medium">Infrastructure as Code (Terraform)</button>
          <button type="button" class="priority-medium">GitOps</button>
          <button type="button" class="priority-low">Cloud Cost Awareness</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="devops-answers.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
