<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>JavaScript</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide" id="fundamentals">
        <h3>Fundamentals</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Variables: var, let and const</button>
          <button type="button" class="priority-must">Scope and Closures</button>
          <button type="button" class="priority-medium">Hoisting</button>
          <button type="button" class="priority-must">this and Binding</button>
          <button type="button" class="priority-must">Equality and Truthiness</button>
          <button type="button" class="priority-medium">Prototypes and Classes</button>
        </nav>
      </article>

      <article class="guide" id="functions-and-async">
        <h3>Functions and Async</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Arrow Functions</button>
          <button type="button" class="priority-must">Promises</button>
          <button type="button" class="priority-must">async and await</button>
          <button type="button" class="priority-must">Event Loop and Microtasks</button>
          <button type="button" class="priority-medium">Error Handling in Async Code</button>
        </nav>
      </article>

      <article class="guide" id="arrays-and-objects">
        <h3>Arrays and Objects</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Array Methods: map, filter, reduce</button>
          <button type="button" class="priority-must">Destructuring and Spread</button>
        </nav>
      </article>

      <article class="guide" id="dom-and-browser">
        <h3>DOM and Browser</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">DOM Manipulation</button>
          <button type="button" class="priority-must">Event Delegation</button>
          <button type="button" class="priority-must">Fetch API</button>
          <button type="button" class="priority-medium">Storage: localStorage, sessionStorage and Cookies</button>
        </nav>
      </article>

      <article class="guide" id="modern-javascript">
        <h3>Modern JavaScript</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Modules: import and export</button>
          <button type="button" class="priority-medium">Optional Chaining and Nullish Coalescing</button>
        </nav>
      </article>

      <article class="guide" id="coding-questions">
        <h3>Coding Questions</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Implement Debounce</button>
          <button type="button" class="priority-must">Implement Throttle</button>
          <button type="button" class="priority-must">Flatten a Nested Array</button>
          <button type="button" class="priority-must">Deep Clone an Object</button>
          <button type="button" class="priority-medium">Implement Memoize</button>
          <button type="button" class="priority-medium">Implement Promise.all</button>
          <button type="button" class="priority-medium">Implement Curry</button>
          <button type="button" class="priority-must">Retry with Exponential Backoff</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="javascript-answers.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
