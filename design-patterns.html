<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Patterns and SOLID — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Design Patterns and SOLID</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>SOLID Principles</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Single Responsibility Principle</button>
          <button type="button" class="priority-must">Open/Closed Principle</button>
          <button type="button" class="priority-must">Liskov Substitution Principle</button>
          <button type="button" class="priority-must">Interface Segregation Principle</button>
          <button type="button" class="priority-must">Dependency Inversion Principle</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Other Design Principles</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">DRY, KISS and YAGNI</button>
          <button type="button" class="priority-medium">Coupling and Cohesion</button>
          <button type="button" class="priority-low">Law of Demeter</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Creational Patterns</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Singleton</button>
          <button type="button" class="priority-must">Factory Method</button>
          <button type="button" class="priority-medium">Abstract Factory</button>
          <button type="button" class="priority-must">Builder</button>
          <button type="button" class="priority-low">Prototype</button>
          <button type="button" class="priority-low">Object Pool</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Structural Patterns</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Adapter</button>
          <button type="button" class="priority-must">Decorator</button>
          <button type="button" class="priority-must">Proxy</button>
          <button type="button" class="priority-must">Facade</button>
          <button type="button" class="priority-medium">Composite</button>
          <button type="button" class="priority-low">Bridge</button>
          <button type="button" class="priority-low">Flyweight</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Behavioural Patterns</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Strategy</button>
          <button type="button" class="priority-must">Observer</button>
          <button type="button" class="priority-must">Template Method</button>
          <button type="button" class="priority-must">Chain of Responsibility</button>
          <button type="button" class="priority-medium">Command</button>
          <button type="button" class="priority-medium">State</button>
          <button type="button" class="priority-medium">Iterator</button>
          <button type="button" class="priority-medium">Visitor</button>
          <button type="button" class="priority-low">Mediator</button>
          <button type="button" class="priority-low">Memento</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Enterprise and Application Patterns</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Repository and DAO</button>
          <button type="button" class="priority-must">DTO and Mapper</button>
          <button type="button" class="priority-must">MVC and Layered Architecture</button>
          <button type="button" class="priority-medium">Null Object</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Anti-patterns and Practice</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Anti-patterns</button>
          <button type="button" class="priority-medium">Code Smells and Refactoring</button>
          <button type="button" class="priority-must">Patterns in the JDK and Spring</button>
        </nav>
      </article>
    </section>
