<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario and Troubleshooting Questions — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Scenario and Troubleshooting Questions</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Production Troubleshooting</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Service Is Slow in Production</button>
          <button type="button" class="priority-must">Memory Keeps Growing</button>
          <button type="button" class="priority-must">CPU at 100 Percent</button>
          <button type="button" class="priority-must">Application Hangs</button>
          <button type="button" class="priority-must">Intermittent Errors Under Load</button>
          <button type="button" class="priority-must">Database Is the Bottleneck</button>
          <button type="button" class="priority-must">Cascading Failure Across Services</button>
          <button type="button" class="priority-must">Third-Party API Is Unreliable</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Data and Consistency</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Duplicate Payments Happened</button>
          <button type="button" class="priority-must">Data Mismatch Between Services</button>
          <button type="button" class="priority-must">Lost or Duplicate Messages</button>
          <button type="button" class="priority-must">Zero-Downtime Schema Change</button>
          <button type="button" class="priority-medium">Migrating a Huge Table</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Design Judgement</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Handle 10x Traffic Next Month</button>
          <button type="button" class="priority-must">Monolith Is Slowing Teams Down</button>
          <button type="button" class="priority-must">Secure a Public API</button>
          <button type="button" class="priority-medium">Choose Between Kafka and RabbitMQ</button>
          <button type="button" class="priority-medium">Rate-Limit Abusive Clients</button>
          <button type="button" class="priority-medium">Large File Upload Design</button>
          <button type="button" class="priority-medium">Flaky Tests Block Releases</button>
          <button type="button" class="priority-medium">Rewrite or Refactor Decision</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="scenarios-answers.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
