<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>CSS</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide" id="selectors-and-cascade">
        <h3>Selectors and Cascade</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Selectors and Specificity</button>
          <button type="button" class="priority-must">Cascade and Inheritance</button>
          <button type="button" class="priority-medium">Stacking Context and z-index</button>
        </nav>
      </article>

      <article class="guide" id="layout">
        <h3>Layout</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Box Model</button>
          <button type="button" class="priority-must">Flexbox</button>
          <button type="button" class="priority-must">CSS Grid</button>
          <button type="button" class="priority-medium">Positioning: Sticky, Fixed and Absolute</button>
        </nav>
      </article>

      <article class="guide" id="responsive-design">
        <h3>Responsive Design</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Media Queries and Mobile-First</button>
          <button type="button" class="priority-medium">Responsive Units and clamp()</button>
        </nav>
      </article>

      <article class="guide" id="styling-patterns">
        <h3>Styling Patterns</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">CSS Custom Properties</button>
          <button type="button" class="priority-must">Scoped Styles in Angular</button>
          <button type="button" class="priority-medium">BEM Naming</button>
          <button type="button" class="priority-low">Dark Mode</button>
        </nav>
      </article>

      <article class="guide" id="animation">
        <h3>Animation</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Transitions and Keyframes</button>
          <button type="button" class="priority-medium">Animation Performance</button>
        </nav>
      </article>

      <article class="guide" id="accessibility">
        <h3>Accessibility</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Focus Styles and Contrast</button>
        </nav>
      </article>

      <article class="guide" id="coding-questions">
        <h3>Coding Questions</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Center a Div</button>
          <button type="button" class="priority-must">Responsive Card Grid</button>
          <button type="button" class="priority-must">Sticky Footer Layout</button>
          <button type="button" class="priority-medium">Fix a Specificity Conflict</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="css-answers.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
