<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versions — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Java Versions</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>
      <div id="version-list" class="version-list"></div>
    </section>
  </main>
  <script src="versions-answers.js"></script>
  <script src="service-answers.js"></script>
  <script>
    const list = document.getElementById("version-list");

    // Priority for a 10-year Java developer: m = must know, d = medium, l = low.
    const PRIORITY = {
      "Generics": "m", "Annotations": "m", "Enums": "d", "Autoboxing": "d",
      "Compiler API": "l", "Scripting API": "l", "JDBC 4.0 driver auto-loading": "l", "@Override on interface methods": "l",
      "Try-with-resources": "m", "Diamond operator": "d", "Multi-catch": "d", "Strings in switch": "d",
      "Lambda expressions": "m", "Stream API": "m", "Functional interfaces and method references": "m",
      "Optional": "m", "Default and static interface methods": "m", "New date and time API": "m",
      "HTTP Client": "m", "New String methods": "d", "Files.readString and writeString": "d",
      "Single-file source launch": "l", "var in lambda parameters": "l",
      "Sealed classes (standard)": "m", "Strong encapsulation by default": "m", "Random number generator API": "l",
      "Virtual threads": "m", "Pattern matching for switch": "m", "Record patterns": "d",
      "Sequenced collections": "d", "Generational ZGC": "d",
      "Scoped values (standard)": "d", "Compact source files and instance main (standard)": "l",
      "Module import declarations (standard)": "l", "Compact object headers": "d"
    };
    const PRIORITY_CLASS = { m: "priority-must", d: "priority-medium", l: "priority-low" };
    const revised = revisedStore();

    VERSIONS.forEach(version => {
      const block = document.createElement("div");
      block.className = "version";

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "version-toggle";
      toggle.setAttribute("aria-expanded", "false");
      toggle.textContent = `${version.name} (${version.year})`;

      const panel = document.createElement("div");
      panel.className = "version-panel";
      panel.hidden = true;

      const features = document.createElement("div");
      features.className = "button-row";

      const answer = document.createElement("div");
      answer.className = "service-answer";
      answer.hidden = true;

      version.features.forEach(feature => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "feature-button " + (PRIORITY_CLASS[PRIORITY[feature.name]] || "");
        button.textContent = feature.name;
        if (revised.set.has(`${version.name}: ${feature.name}`)) button.classList.add("revised");
        button.addEventListener("click", () => {
          const wasOpen = !answer.hidden && answer.dataset.feature === feature.name;
          features.querySelectorAll("button").forEach(b => b.setAttribute("aria-expanded", "false"));
          if (wasOpen) {
            answer.hidden = true;
            return;
          }
          renderAnswer(answer, `${version.name}: ${feature.name}`, feature.answer, button);
          answer.dataset.feature = feature.name;
          answer.hidden = false;
          button.setAttribute("aria-expanded", "true");
        });
        features.appendChild(button);
      });

      toggle.addEventListener("click", () => {
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!expanded));
        panel.hidden = expanded;
      });

      panel.append(features, answer);
      block.append(toggle, panel);
      list.appendChild(block);
    });
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
