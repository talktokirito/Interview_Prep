<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Spring</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide" id="core-spring-framework">
        <h3>Core Spring Framework</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">IoC and Dependency Injection</button>
          <button type="button" class="priority-must">Bean Lifecycle and Scopes</button>
          <button type="button" class="priority-must">Java Configuration and @Bean</button>
          <button type="button" class="priority-must">Spring AOP</button>
          <button type="button" class="priority-medium">Application Events</button>
          <button type="button" class="priority-medium">Spring Retry</button>
          <button type="button" class="priority-low">Spring Expression Language (SpEL)</button>
        </nav>
      </article>

      <article class="guide" id="spring-boot">
        <h3>Spring Boot</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Spring Boot</button>
          <button type="button" class="priority-must">Auto-configuration</button>
          <button type="button" class="priority-must">Starters</button>
          <button type="button" class="priority-must">Externalized Configuration</button>
          <button type="button" class="priority-must">Actuator</button>
          <button type="button" class="priority-medium">GraalVM Native Image</button>
          <button type="button" class="priority-medium">Containerisation (Buildpacks and Docker)</button>
          <button type="button" class="priority-low">Spring Boot DevTools</button>
        </nav>
      </article>

      <article class="guide" id="web-and-apis">
        <h3>Web and APIs</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Spring MVC</button>
          <button type="button" class="priority-must">REST Controllers</button>
          <button type="button" class="priority-must">Exception Handling and ProblemDetail</button>
          <button type="button" class="priority-must">Validation (Bean Validation)</button>
          <button type="button" class="priority-must">RestClient and WebClient</button>
          <button type="button" class="priority-medium">Spring WebFlux</button>
          <button type="button" class="priority-medium">Spring GraphQL</button>
          <button type="button" class="priority-low">WebSocket and STOMP</button>
          <button type="button" class="priority-low">Spring HATEOAS</button>
        </nav>
      </article>

      <article class="guide" id="data-and-persistence">
        <h3>Data and Persistence</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Transaction Management</button>
          <button type="button" class="priority-must">Spring Data JPA</button>
          <button type="button" class="priority-must">Spring Cache</button>
          <button type="button" class="priority-must">Database Migrations (Flyway and Liquibase)</button>
          <button type="button" class="priority-medium">JdbcTemplate and JdbcClient</button>
          <button type="button" class="priority-medium">Spring Data MongoDB</button>
          <button type="button" class="priority-medium">Spring Data Redis</button>
          <button type="button" class="priority-low">Spring Data R2DBC</button>
          <button type="button" class="priority-low">Spring Data REST</button>
        </nav>
      </article>

      <article class="guide" id="security">
        <h3>Security</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Spring Security</button>
          <button type="button" class="priority-must">OAuth2 and JWT</button>
          <button type="button" class="priority-medium">Method Security</button>
          <button type="button" class="priority-low">Spring Authorization Server</button>
          <button type="button" class="priority-low">Spring Session</button>
        </nav>
      </article>

      <article class="guide" id="cloud-and-microservices">
        <h3>Cloud and Microservices</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Spring Cloud</button>
          <button type="button" class="priority-must">Spring Cloud Gateway</button>
          <button type="button" class="priority-must">Circuit Breaker (Resilience4j)</button>
          <button type="button" class="priority-medium">Service Discovery (Eureka)</button>
          <button type="button" class="priority-medium">Spring Cloud Config</button>
          <button type="button" class="priority-medium">OpenFeign and HTTP Interfaces</button>
        </nav>
      </article>

      <article class="guide" id="messaging-and-integration">
        <h3>Messaging and Integration</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Spring Kafka</button>
          <button type="button" class="priority-medium">Spring AMQP (RabbitMQ)</button>
          <button type="button" class="priority-medium">Spring Cloud Stream</button>
          <button type="button" class="priority-low">Spring JMS</button>
          <button type="button" class="priority-low">Spring Integration</button>
        </nav>
      </article>

      <article class="guide" id="batch-and-scheduling">
        <h3>Batch and Scheduling</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Scheduling and @Async</button>
          <button type="button" class="priority-medium">Spring Batch</button>
        </nav>
      </article>

      <article class="guide" id="spring-ai">
        <h3>Spring AI</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Spring AI</button>
          <button type="button" class="priority-medium">ChatClient and Prompts</button>
          <button type="button" class="priority-medium">RAG and Vector Stores</button>
          <button type="button" class="priority-low">Tool Calling and MCP</button>
          <button type="button" class="priority-low">Structured Output and Chat Memory</button>
        </nav>
      </article>

      <article class="guide" id="observability">
        <h3>Observability</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Micrometer and Observability</button>
          <button type="button" class="priority-medium">Distributed Tracing</button>
        </nav>
      </article>

      <article class="guide" id="testing">
        <h3>Testing</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Spring Boot Test and Slice Tests</button>
          <button type="button" class="priority-medium">MockMvc and WebTestClient</button>
          <button type="button" class="priority-medium">Testcontainers</button>
        </nav>
      </article>

      <article class="guide" id="other-spring-projects">
        <h3>Other Spring Projects</h3>
        <nav class="button-row">
          <button type="button" class="priority-low">Spring Modulith</button>
          <button type="button" class="priority-low">Spring Shell</button>
          <button type="button" class="priority-low">Spring Web Services (SOAP)</button>
          <button type="button" class="priority-low">Spring LDAP</button>
          <button type="button" class="priority-low">Spring Vault</button>
          <button type="button" class="priority-low">Spring REST Docs</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="spring-answers.js"></script>
  <script src="spring-answers-more.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
