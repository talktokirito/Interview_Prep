<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>AWS Services</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Compute</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">EC2</button>
          <button type="button" class="priority-must">Lambda</button>
          <button type="button" class="priority-medium">Elastic Beanstalk</button>
          <button type="button" class="priority-low">Lightsail</button>
          <button type="button" class="priority-medium">Batch</button>
          <button type="button" class="priority-low">Outposts</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Containers</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">ECS</button>
          <button type="button" class="priority-must">EKS</button>
          <button type="button" class="priority-must">Fargate</button>
          <button type="button" class="priority-must">ECR</button>
          <button type="button" class="priority-medium">App Runner</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Storage</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">S3</button>
          <button type="button" class="priority-must">EBS</button>
          <button type="button" class="priority-medium">EFS</button>
          <button type="button" class="priority-low">FSx</button>
          <button type="button" class="priority-medium">S3 Glacier</button>
          <button type="button" class="priority-low">Storage Gateway</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Database</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">RDS</button>
          <button type="button" class="priority-must">Aurora</button>
          <button type="button" class="priority-must">DynamoDB</button>
          <button type="button" class="priority-must">ElastiCache</button>
          <button type="button" class="priority-medium">MemoryDB</button>
          <button type="button" class="priority-medium">DocumentDB</button>
          <button type="button" class="priority-low">Neptune</button>
          <button type="button" class="priority-low">Keyspaces</button>
          <button type="button" class="priority-low">Timestream</button>
          <button type="button" class="priority-low">QLDB</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Networking and Content Delivery</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">VPC</button>
          <button type="button" class="priority-must">Route 53</button>
          <button type="button" class="priority-must">CloudFront</button>
          <button type="button" class="priority-must">Elastic Load Balancing</button>
          <button type="button" class="priority-must">API Gateway</button>
          <button type="button" class="priority-medium">Direct Connect</button>
          <button type="button" class="priority-low">Global Accelerator</button>
          <button type="button" class="priority-medium">Transit Gateway</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Application Integration</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">SQS</button>
          <button type="button" class="priority-must">SNS</button>
          <button type="button" class="priority-must">EventBridge</button>
          <button type="button" class="priority-medium">Step Functions</button>
          <button type="button" class="priority-medium">Amazon MQ</button>
          <button type="button" class="priority-low">AppSync</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Analytics</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Athena</button>
          <button type="button" class="priority-low">EMR</button>
          <button type="button" class="priority-medium">Glue</button>
          <button type="button" class="priority-medium">Kinesis</button>
          <button type="button" class="priority-medium">Redshift</button>
          <button type="button" class="priority-low">QuickSight</button>
          <button type="button" class="priority-low">Lake Formation</button>
          <button type="button" class="priority-medium">OpenSearch Service</button>
        </nav>
      </article>

      <article class="guide">
        <h3>AI and Machine Learning</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">SageMaker</button>
          <button type="button" class="priority-medium">Bedrock</button>
          <button type="button" class="priority-low">Rekognition</button>
          <button type="button" class="priority-low">Comprehend</button>
          <button type="button" class="priority-low">Lex</button>
          <button type="button" class="priority-low">Polly</button>
          <button type="button" class="priority-low">Textract</button>
          <button type="button" class="priority-low">Transcribe</button>
          <button type="button" class="priority-low">Translate</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Security, Identity and Compliance</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">IAM</button>
          <button type="button" class="priority-must">KMS</button>
          <button type="button" class="priority-must">Secrets Manager</button>
          <button type="button" class="priority-medium">Cognito</button>
          <button type="button" class="priority-medium">WAF</button>
          <button type="button" class="priority-low">Shield</button>
          <button type="button" class="priority-medium">GuardDuty</button>
          <button type="button" class="priority-low">Inspector</button>
          <button type="button" class="priority-low">Macie</button>
          <button type="button" class="priority-medium">Security Hub</button>
          <button type="button" class="priority-medium">Organizations</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Management and Monitoring</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">CloudWatch</button>
          <button type="button" class="priority-medium">CloudTrail</button>
          <button type="button" class="priority-must">CloudFormation</button>
          <button type="button" class="priority-medium">Systems Manager</button>
          <button type="button" class="priority-medium">AWS Config</button>
          <button type="button" class="priority-low">Control Tower</button>
          <button type="button" class="priority-low">Trusted Advisor</button>
          <button type="button" class="priority-low">Cost Explorer</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Developer Tools</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">CodeBuild</button>
          <button type="button" class="priority-medium">CodeCommit</button>
          <button type="button" class="priority-medium">CodeDeploy</button>
          <button type="button" class="priority-medium">CodePipeline</button>
          <button type="button" class="priority-medium">CodeArtifact</button>
          <button type="button" class="priority-low">Cloud9</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="aws-answers.js"></script>
  <script src="service-answers.js"></script>
</body>
</html>
