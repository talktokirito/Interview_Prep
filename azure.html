<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Azure Services</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Compute</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Virtual Machines</button>
          <button type="button" class="priority-medium">Virtual Machine Scale Sets</button>
          <button type="button" class="priority-must">Azure Functions</button>
          <button type="button" class="priority-must">App Service</button>
          <button type="button" class="priority-medium">Container Apps</button>
          <button type="button" class="priority-medium">Container Instances</button>
          <button type="button" class="priority-low">Azure Batch</button>
          <button type="button" class="priority-medium">Azure Spring Apps</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Containers</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Azure Kubernetes Service (AKS)</button>
          <button type="button" class="priority-must">Azure Container Registry</button>
          <button type="button" class="priority-low">Azure Red Hat OpenShift</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Storage</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Blob Storage</button>
          <button type="button" class="priority-medium">Azure Files</button>
          <button type="button" class="priority-medium">Managed Disks</button>
          <button type="button" class="priority-medium">Queue Storage</button>
          <button type="button" class="priority-low">Azure NetApp Files</button>
          <button type="button" class="priority-medium">Data Lake Storage</button>
          <button type="button" class="priority-low">Azure Backup</button>
          <button type="button" class="priority-low">Azure Site Recovery</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Databases</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Azure SQL Database</button>
          <button type="button" class="priority-medium">SQL Managed Instance</button>
          <button type="button" class="priority-must">Azure Cosmos DB</button>
          <button type="button" class="priority-must">Azure Database for PostgreSQL</button>
          <button type="button" class="priority-medium">Azure Database for MySQL</button>
          <button type="button" class="priority-must">Azure Cache for Redis</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Networking</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Virtual Network</button>
          <button type="button" class="priority-must">Load Balancer</button>
          <button type="button" class="priority-medium">Application Gateway</button>
          <button type="button" class="priority-medium">Azure Front Door</button>
          <button type="button" class="priority-medium">Azure CDN</button>
          <button type="button" class="priority-medium">Azure DNS</button>
          <button type="button" class="priority-medium">Azure Firewall</button>
          <button type="button" class="priority-medium">ExpressRoute</button>
          <button type="button" class="priority-medium">VPN Gateway</button>
          <button type="button" class="priority-low">Traffic Manager</button>
          <button type="button" class="priority-low">Azure Bastion</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Integration and Messaging</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Service Bus</button>
          <button type="button" class="priority-medium">Event Hubs</button>
          <button type="button" class="priority-medium">Event Grid</button>
          <button type="button" class="priority-medium">Logic Apps</button>
          <button type="button" class="priority-must">API Management</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Analytics</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Azure Synapse Analytics</button>
          <button type="button" class="priority-medium">Azure Data Factory</button>
          <button type="button" class="priority-medium">Azure Databricks</button>
          <button type="button" class="priority-low">HDInsight</button>
          <button type="button" class="priority-low">Stream Analytics</button>
          <button type="button" class="priority-low">Microsoft Fabric</button>
          <button type="button" class="priority-low">Power BI</button>
        </nav>
      </article>

      <article class="guide">
        <h3>AI and Machine Learning</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Azure OpenAI Service</button>
          <button type="button" class="priority-medium">Azure Machine Learning</button>
          <button type="button" class="priority-medium">Azure AI Search</button>
          <button type="button" class="priority-low">Azure AI Services</button>
          <button type="button" class="priority-low">Azure AI Document Intelligence</button>
          <button type="button" class="priority-low">Azure AI Speech</button>
          <button type="button" class="priority-low">Azure Bot Service</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Identity and Security</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Microsoft Entra ID</button>
          <button type="button" class="priority-must">Key Vault</button>
          <button type="button" class="priority-medium">Microsoft Defender for Cloud</button>
          <button type="button" class="priority-medium">Microsoft Sentinel</button>
          <button type="button" class="priority-medium">Azure Policy</button>
          <button type="button" class="priority-low">DDoS Protection</button>
          <button type="button" class="priority-medium">Private Link</button>
          <button type="button" class="priority-must">Azure Role-Based Access Control</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Management and Monitoring</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Azure Monitor</button>
          <button type="button" class="priority-medium">Log Analytics</button>
          <button type="button" class="priority-must">Application Insights</button>
          <button type="button" class="priority-must">Azure Resource Manager</button>
          <button type="button" class="priority-low">Azure Automation</button>
          <button type="button" class="priority-low">Azure Advisor</button>
          <button type="button" class="priority-low">Cost Management</button>
          <button type="button" class="priority-low">Azure Arc</button>
        </nav>
      </article>

      <article class="guide">
        <h3>DevOps</h3>
        <nav class="button-row">
          <button type="button" class="priority-medium">Azure DevOps</button>
          <button type="button" class="priority-must">Azure Pipelines</button>
          <button type="button" class="priority-medium">Azure Artifacts</button>
          <button type="button" class="priority-low">Azure Load Testing</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="azure-answers.js"></script>
  <script src="service-answers.js"></script>
</body>
</html>
