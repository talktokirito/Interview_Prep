<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Questions — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Frequently Asked Coding Questions</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Strings and Arrays</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Reverse a String</button>
          <button type="button" class="priority-must">Check Anagram</button>
          <button type="button" class="priority-must">Find Duplicate Elements</button>
          <button type="button" class="priority-must">Two Sum</button>
          <button type="button" class="priority-must">Maximum Subarray (Kadane)</button>
          <button type="button" class="priority-medium">Move Zeros to End</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Hashing and Collections</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">First Non-Repeating Character</button>
          <button type="button" class="priority-must">Group Anagrams</button>
          <button type="button" class="priority-must">LRU Cache</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Linked Lists and Trees</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Reverse a Linked List</button>
          <button type="button" class="priority-must">Detect Cycle in a Linked List</button>
          <button type="button" class="priority-must">Binary Tree Level Order Traversal</button>
          <button type="button" class="priority-medium">Validate Binary Search Tree</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Java Streams (Streams and Collections)</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Word Frequency Count</button>
          <button type="button" class="priority-must">Second Highest Number</button>
          <button type="button" class="priority-must">Group Employees by Department</button>
          <button type="button" class="priority-must">Flatten a List of Lists</button>
          <button type="button" class="priority-must">Top N Highest Salaries</button>
          <button type="button" class="priority-medium">Partition Even and Odd Numbers</button>
          <button type="button" class="priority-medium">First Non-Repeated Element in a Stream</button>
          <button type="button" class="priority-medium">Sum of Squares of Odd Numbers</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Spring REST and Full-Stack</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Full CRUD with REST Controller and Database Query</button>
          <button type="button" class="priority-must">POST Request from Angular to REST Controller</button>
          <button type="button" class="priority-must">Microservice Communication Methods</button>
          <button type="button" class="priority-must">Ways to Receive a Request in a Controller</button>
        </nav>
      </article>
    </section>
