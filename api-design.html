<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Design — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>API Design</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>REST Fundamentals</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Resource Modelling and URIs</button>
          <button type="button" class="priority-must">HTTP Methods and Idempotency</button>
          <button type="button" class="priority-must">HTTP Status Codes</button>
          <button type="button" class="priority-medium">Richardson Maturity Model</button>
          <button type="button" class="priority-medium">Content Negotiation</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Contracts and Evolution</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">API Versioning</button>
          <button type="button" class="priority-must">Backward Compatibility</button>
          <button type="button" class="priority-must">OpenAPI and Contract-First</button>
          <button type="button" class="priority-must">Pagination, Filtering and Sorting</button>
          <button type="button" class="priority-must">Error Handling (Problem Details)</button>
          <button type="button" class="priority-medium">Bulk and Partial Updates (PATCH)</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Behaviour and Performance</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">HTTP Caching and ETags</button>
          <button type="button" class="priority-must">Idempotency Keys</button>
          <button type="button" class="priority-medium">Rate Limiting Headers</button>
          <button type="button" class="priority-medium">Long-Running Operations (202 Accepted)</button>
          <button type="button" class="priority-medium">Webhooks</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Choosing and Securing</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">REST vs GraphQL vs gRPC</button>
          <button type="button" class="priority-must">API Authentication Methods</button>
          <button type="button" class="priority-medium">API Gateway Concerns</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="api-design-answers.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
