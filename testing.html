<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testing — Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="page-button" href="index.html">Back</a>
  </header>
  <main>
    <section>
      <h2>Testing</h2>
      <p class="legend">
        <span class="priority-must">Must know</span>
        <span class="priority-medium">Medium priority</span>
        <span class="priority-low">Low priority</span>
      </p>

      <article class="guide">
        <h3>Fundamentals</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Test Pyramid and Strategy</button>
          <button type="button" class="priority-must">Unit Testing Best Practices</button>
          <button type="button" class="priority-must">Test Doubles (Mock, Stub, Fake, Spy)</button>
          <button type="button" class="priority-medium">TDD</button>
          <button type="button" class="priority-low">BDD and Cucumber</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Tools</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">JUnit 5 Essentials</button>
          <button type="button" class="priority-must">Mockito</button>
          <button type="button" class="priority-medium">Parameterized and Dynamic Tests</button>
          <button type="button" class="priority-medium">AssertJ and Hamcrest</button>
          <button type="button" class="priority-medium">Awaitility (Async Testing)</button>
          <button type="button" class="priority-medium">WireMock</button>
        </nav>
      </article>

      <article class="guide">
        <h3>Integration and Quality</h3>
        <nav class="button-row">
          <button type="button" class="priority-must">Integration Testing Strategies</button>
          <button type="button" class="priority-must">Code Coverage</button>
          <button type="button" class="priority-must">Flaky Tests</button>
          <button type="button" class="priority-medium">Test Data Management</button>
          <button type="button" class="priority-medium">Contract Testing</button>
          <button type="button" class="priority-medium">Mutation Testing</button>
          <button type="button" class="priority-medium">ArchUnit and Architecture Tests</button>
          <button type="button" class="priority-medium">Performance and Load Testing</button>
          <button type="button" class="priority-medium">Testing Concurrent Code</button>
          <button type="button" class="priority-low">Property-Based Testing</button>
        </nav>
      </article>
    </section>
  </main>
  <script src="testing-answers.js"></script>
  <script src="service-answers.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
